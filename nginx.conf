server {
    listen 80;
    server_name www.kirmy.org;
    return 301 https://kirmy.org$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
